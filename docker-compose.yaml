services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eshopify
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d eshopify"]
      interval: 5s
      timeout: 5s
      retries: 10

  eshopify:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ESHOPIFY_DB_HOST: eshopify
      ESHOPIFY_DB_PORT: 5432
      ESHOPIFY_DB_USERNAME: root
      ESHOPIFY_DB_PASSWORD: root
    ports:
      - "8080:8080"